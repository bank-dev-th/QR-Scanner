<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 สแกนคิวอาร์โค้ด — เปิดลิงก์อัตโนมัติ</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4f46e5);
            min-height: 100vh;
            color: white;
            padding: 20px 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: clamp(24px, 6vw, 32px);
            margin-bottom: 8px;
        }
        .header p {
            color: #a5b4fc;
            font-size: 14px;
        }
        .scanner-box {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 4/3;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            display: none;
        }
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border: 3px solid #10b981;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 1; }
            50% { top: 100%; opacity: 0.8; }
            100% { top: 0; opacity: 1; }
        }
        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: #10b981;
            border-width: 3px;
        }
        .corner-tl { top: -3px; left: -3px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .corner-tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .corner-bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .corner-br { bottom: -3px; right: -3px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
        
        .status-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-text {
            font-size: 15px;
            color: #a5b4fc;
            margin-bottom: 10px;
        }
        .auto-notice {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #6ee7b7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .result-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .result-label {
            font-size: 12px;
            color: #6ee7b7;
            margin-bottom: 8px;
        }
        .result-text {
            font-size: 14px;
            word-break: break-all;
            line-height: 1.5;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        .link-badge {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 90px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-copy {
            background: #3b82f6;
            color: white;
        }
        .btn-open {
            background: #8b5cf6;
            color: white;
        }
        .permission-note {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #f87171;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            display: none;
        }
        .permission-note.show {
            display: block;
        }
        .permission-note h3 {
            color: #fca5a5;
            margin-bottom: 10px;
        }
        .permission-note p {
            color: #fecaca;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .flash-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flash-btn.on {
            background: rgba(255, 255, 0, 0.3);
        }
        .auto-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4b5563;
            border-radius: 24px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .toggle-slider {
            background-color: #10b981;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 สแกนคิวอาร์โค้ด</h1>
            <p>ชี้กล้องไปที่คิวอาร์โค้ด — ลิงก์จะเปิดเองโดยอัตโนมัติ</p>
        </div>

        <!-- กล้องสแกน -->
        <div class="scanner-box" id="scannerBox">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            
            <div class="scan-frame">
                <div class="scan-line"></div>
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
            </div>
            
            <button class="flash-btn" id="flashBtn" onclick="toggleFlash()">🔦</button>
        </div>

        <!-- แจ้งเตือนขอสิทธิ์ -->
        <div class="permission-note" id="permissionNote">
            <h3>📷 ต้องการสิทธิ์ใช้กล้อง</h3>
            <p>กรุณาอนุญาตการเข้าถึงกล้องเพื่อใช้งานเครื่องสแกน</p>
            <button class="btn-primary" onclick="initCamera()">ลองอีกครั้ง</button>
        </div>

        <!-- ส่วนสถานะและผลลัพธ์ -->
        <div class="status-box">
            <!-- เปิดลิงก์อัตโนมัติ - เปิด/ปิด -->
            <div class="auto-switch">
                <span style="font-size:13px; color:#a5b4fc;">🌐 เปิดลิงก์อัตโนมัติ</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoOpenToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            
            <p class="status-text" id="statusText">⏳ กำลังเตรียมกล้อง...</p>
            
            <div class="result-box" id="resultBox">
                <div class="auto-notice" id="autoNotice">
                    ✅ ตรวจพบลิงก์ → จะเปิดหน้าต่างใหม่อัตโนมัติใน 3 วินาที...
                </div>
                <p class="result-label">✅ ผลลัพธ์:</p>
                <span class="link-badge" id="linkBadge">🔗 ลิงก์เว็บไซต์</span>
                <p class="result-text" id="resultText"></p>
                <div class="btn-row">
                    <button class="btn-open" id="openBtn" onclick="openLink()">🌐 เปิดลิงก์ทันที</button>
                    <button class="btn-copy" onclick="copyResult()">📋 คัดลอก</button>
                    <button class="btn-secondary" onclick="rescan()">🔄 สแกนใหม่</button>
                </div>
            </div>
        </div>
    </div>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('statusText');
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');
const permissionNote = document.getElementById('permissionNote');
const openBtn = document.getElementById('openBtn');
const linkBadge = document.getElementById('linkBadge');
const autoNotice = document.getElementById('autoNotice');
const autoOpenToggle = document.getElementById('autoOpenToggle');
const flashBtn = document.getElementById('flashBtn');

let scanning = true;
let stream = null;
let detectedCode = '';
let track = null;
let flashOn = false;
let autoOpenTimer = null;

// ตรวจสอบว่าเป็นลิงก์หรือไม่
function isUrl(text) {
    return /^(http|https|www\.)/i.test(text) || 
           (text.includes('.com') || text.includes('.co.th') || text.includes('.net') || text.includes('.org')) && 
           !text.includes(' ') && text.length > 5;
}

// ทำให้ลิงก์สมบูรณ์
function fixUrl(text) {
    if (/^www\./i.test(text)) {
        return 'https://' + text;
    }
    if (!/^(http|https):\/\//i.test(text)) {
        return 'https://' + text;
    }
    return text;
}

// เปิดลิงก์
function openLink() {
    if (!detectedCode) return;
    const url = fixUrl(detectedCode);
    window.open(url, '_blank');
}

// เริ่มต้นกล้อง
async function initCamera() {
    try {
        permissionNote.classList.remove('show');
        statusText.textContent = '⏳ กำลังขอสิทธิ์กล้อง...';
        
        stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: 'environment',
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        });
        
        video.srcObject = stream;
        track = stream.getVideoTracks()[0];
        
        statusText.textContent = '✅ พร้อมสแกน — ชี้กล้องไปที่คิวอาร์โค้ด';
        
        video.onloadedmetadata = function() {
            requestAnimationFrame(scanQRCode);
        };
        
    } catch (err) {
        console.error('Camera error:', err);
        permissionNote.classList.add('show');
        statusText.textContent = '❌ ไม่สามารถเข้าถึงกล้องได้';
    }
}

// สแกนคิวอาร์โค้ด
function scanQRCode() {
    if (!scanning) {
        requestAnimationFrame(scanQRCode);
        return;
    }
    
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: 'dontInvert'
        });
        
        if (code) {
            scanning = false;
            detectedCode = code.data;
            showResult(detectedCode);
            return;
        }
    }
    
    requestAnimationFrame(scanQRCode);
}

// แสดงผลลัพธ์
function showResult(text) {
    resultText.textContent = text;
    resultBox.classList.add('show');
    
    const urlCheck = isUrl(text);
    
    if (urlCheck) {
        linkBadge.style.display = 'inline-block';
        openBtn.style.display = 'block';
        autoNotice.style.display = 'block';
        statusText.textContent = '✅ พบลิงก์เว็บไซต์';
        
        // เปิดลิงก์อัตโนมัติ ถ้าเปิดใช้งานอยู่
        if (autoOpenToggle.checked) {
            let countdown = 3;
            autoNotice.innerHTML = `✅ พบลิงก์ → เปิดอัตโนมัติใน <span id="countdown">${countdown}</span> วินาที...`;
            
            autoOpenTimer = setInterval(() => {
                countdown--;
                const countdownEl = document.getElementById('countdown');
                if (countdownEl) countdownEl.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(autoOpenTimer);
                    openLink();
                }
            }, 1000);
        } else {
            autoNotice.innerHTML = 'ℹ️ เปิดลิงก์อัตโนมัติปิดอยู่ — กดปุ่ม "เปิดลิงก์ทันที" ด้านล่าง';
        }
    } else {
        linkBadge.style.display = 'none';
        openBtn.style.display = 'none';
        autoNotice.style.display = 'none';
        statusText.textContent = '✅ อ่านข้อมูลสำเร็จ';
        
        if (autoOpenTimer) {
            clearInterval(autoOpenTimer);
            autoOpenTimer = null;
        }
    }
}

// คัดลอกผลลัพธ์
function copyResult() {
    navigator.clipboard.writeText(detectedCode).then(() => {
        alert('✅ คัดลอกเรียบร้อย!');
    });
}

// สแกนใหม่
function rescan() {
    if (autoOpenTimer) {
        clearInterval(autoOpenTimer);
        autoOpenTimer = null;
    }
    resultBox.classList.remove('show');
    statusText.textContent = '✅ พร้อมสแกน — ชี้กล้องไปที่คิวอาร์โค้ด';
    detectedCode = '';
    scanning = true;
    requestAnimationFrame(scanQRCode);
}

// เปิด-ปิดไฟแฟลช
async function toggleFlash() {
    if (!track) return;
    
    try {
        const capabilities = track.getCapabilities();
        if (!capabilities.torch) {
            alert('❌ อุปกรณ์ของคุณไม่รองรับไฟแฟลช');
            return;
        }
        
        flashOn = !flashOn;
        await track.applyConstraints({
            advanced: [{ torch: flashOn }]
        });
        flashBtn.classList.toggle('on', flashOn);
    } catch (err) {
        alert('❌ ไม่สามารถเปิดไฟแฟลชได้');
    }
}

// เริ่มทำงาน
window.onload = initCamera;

// ป้องกันหน้าจอล็อก
let wakeLock = null;
async function requestWakeLock() {
    try {
        wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
        console.log('Wake Lock not supported');
    }
}
document.addEventListener('visibilitychange', async () => {
    if (wakeLock && document.visibilityState === 'visible') {
        requestWakeLock();
    }
});
requestWakeLock();

</script>
</body>
</html>
